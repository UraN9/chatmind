services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatmind_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: chatmind_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override whatever's in .env: inside the compose network the
      # bot must reach Postgres by service name on the internal port,
      # not via the host-mapped 5433 used for external access.
      # NOTE: config.py reads POSTGRES_HOST/POSTGRES_PORT (not
      # DB_HOST/DB_PORT) -- these names must match exactly.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      # Persist the downloaded CLIP weights across container restarts
      # -- without this, open-clip-torch re-downloads them from the
      # HF Hub every time the container starts fresh.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache: