services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatmind_db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Hardcoded, not ${POSTGRES_USER:-postgres}: that interpolation
      # syntax is resolved by Compose itself from the root .env file,
      # a *different* mechanism from the env_file: above -- using it
      # here would silently ignore .env.docker. "postgres" matches
      # the default user in .env.docker.example anyway.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: chatmind_bot
    restart: unless-stopped
    env_file:
      # Container-appropriate values (POSTGRES_HOST=db, no Windows
      # paths for TESSERACT_CMD/HF_HOME, etc.) -- see
      # .env.docker.example for the template. Deliberately NOT .env,
      # which is for running the bot directly on the host.
      - .env.docker
    volumes:
      # Persist the downloaded CLIP weights across container restarts
      # -- without this, open-clip-torch re-downloads them from the
      # HF Hub every time the container starts fresh.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache: