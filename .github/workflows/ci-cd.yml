name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: chatmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_TEST_DB: chatmind_test
      # Never a real token: test_main.py monkeypatches this anyway,
      # but config.py may still expect *something* set at import time.
      TELEGRAM_BOT_TOKEN: "000000:CI-placeholder-not-a-real-token"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Tesseract OCR, psql client)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr postgresql-client

      - name: Install Python dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Initialize database schema (creates chatmind + chatmind_test)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d chatmind -f db/init.sql

      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        # GHCR (like all Docker registries) requires lowercase image
        # names; github.repository preserves the repo's actual
        # casing (e.g. "UraN9/chatmind"), which would fail the push.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # Required for the type=gha cache backend below -- the
        # default "docker" driver doesn't support it.
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max